name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Writes a short-lived ACR token to the Docker config, which `dotnet publish` uses for the push.
      # The identity needs the AcrPush role on the registry (assigned by the setup script).
      # The container app itself pulls with its system-assigned managed identity (AcrPull),
      # so no registry credentials are stored on the app.
      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Builds the image with the .NET SDK's built-in container support (no Dockerfile needed)
      # and pushes it to the ACR using the credentials from `az acr login`.
      # Base image (mcr.microsoft.com/dotnet/aspnet:10.0), port 8080 and non-root user "app"
      # are SDK defaults.
      - name: Build and push image
        run: >
          dotnet publish StreamWriter.Web
          --configuration Release
          --os linux --arch x64
          -t:PublishContainer
          -p:ContainerRegistry=${{ vars.ACR_LOGIN_SERVER }}
          -p:ContainerRepository=${{ vars.IMAGE_NAME }}
          -p:ContainerImageTag=${{ github.sha }}

      - name: Deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP }}
